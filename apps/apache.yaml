apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  namespace: parcial-jjlr
  labels:
    app: apache
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
        - name: apache
          image: httpd:2.4-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: apache
  namespace: parcial-jjlr
spec:
  type: ClusterIP
  selector:
    app: apache
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: apache
  namespace: parcial-jjlr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`apache.jjlr.com`)
      kind: Rule
      services:
        - name: apache
          port: 80
