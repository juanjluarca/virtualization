apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: parcial-jjlr
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.0.0
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: parcial-jjlr
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: parcial-jjlr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.jjlr.com`)
      kind: Rule
      services:
        - name: grafana
          port: 80
