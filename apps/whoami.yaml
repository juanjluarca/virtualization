apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: parcial-jjlr
  labels:
    app: whoami
spec:
  replicas: 3
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: parcial-jjlr
spec:
  type: ClusterIP
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: parcial-jjlr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`whoami.jjlr.com`)
      kind: Rule
      services:
        - name: whoami
          port: 80
