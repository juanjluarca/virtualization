apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: parcial-jjlr
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: parcial-jjlr
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx
  namespace: parcial-jjlr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`nginx.jjlr.com`)
      kind: Rule
      services:
        - name: nginx
          port: 80
