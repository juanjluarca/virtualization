datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server
        access: proxy
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        url: http://loki:3100
        access: proxy

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
