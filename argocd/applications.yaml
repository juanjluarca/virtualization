apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parcial-nginx
  namespace: argocd-jjlr
spec:
  project: default
  source:
    repoURL: https://github.com/juanjluarca/virtualization.git
    targetRevision: hw-06
    path: apps
    directory:
      include: nginx.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: parcial-jjlr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
